name: Flutter Multi-Platform Build

# STORY-012 — garantit que les 3 cibles (Android, iOS, Web) compilent à
# chaque PR. Sans ce filet, un dev "fixe" Android et casse Web silencieusement.

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-multiplatform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-multiplatform.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

defaults:
  run:
    working-directory: apps/flutter

jobs:
  analyze-and-test:
    name: Analyze + tests + lints custom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dart format (check only)
        run: dart format --output=none --set-exit-if-changed lib test scripts

      - name: flutter analyze
        run: flutter analyze

      - name: Lint — no hardcoded tokens
        run: dart run scripts/check_no_hardcoded_tokens.dart

      - name: Lint — no direct platform check (STORY-012)
        run: dart run scripts/check_no_direct_platform_check.dart

      - name: flutter test (unit + widget)
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: apps/flutter/coverage/lcov.info
          if-no-files-found: warn

  android-build:
    name: Android — APK + AAB release
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK (release, debug-signed Phase 1)
        run: flutter build apk --release

      - name: Build AAB (release, debug-signed Phase 1)
        run: flutter build appbundle --release

      - name: Report APK size
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          size_bytes=$(stat -c '%s' build/app/outputs/flutter-apk/app-release.apk)
          size_mb=$((size_bytes / 1024 / 1024))
          echo "APK size: ${size_mb} MB"
          if [ "$size_mb" -gt 30 ]; then
            echo "::warning::APK > 30MB target (STORY-012 AC-01)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: apps/flutter/build/app/outputs/bundle/release/app-release.aab

  ios-build:
    name: iOS — release no-codesign
    runs-on: macos-14
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (no codesign — Phase 1)
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: apps/flutter/build/ios/iphoneos/Runner.app
          if-no-files-found: warn

  web-build:
    name: Web — release (PWA + service worker)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Web release
        run: flutter build web --release

      - name: Report Web bundle size
        run: |
          du -sh build/web
          total_kb=$(du -sk build/web | cut -f1)
          total_mb=$((total_kb / 1024))
          echo "Web bundle size: ${total_mb} MB"
          if [ "$total_mb" -gt 5 ]; then
            echo "::warning::Web bundle > 5MB target (STORY-012 perf budget)"
          fi

      - name: Verify PWA assets present
        run: |
          test -f build/web/manifest.json
          test -f build/web/flutter_service_worker.js
          test -f build/web/index.html
          grep -q '"name": "Scalario' build/web/manifest.json
          grep -q 'theme-color' build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: apps/flutter/build/web
