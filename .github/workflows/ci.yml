name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nestjs-tests:
    name: NestJS — test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: scalario_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scalario_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/scalario_test
      JWT_SECRET: ci_jwt_secret_min_32_chars_dummy_value_xx
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_min_32_chars_dummy
      SCALARIO_APP_DB_PASSWORD: scalario_app_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Test
        run: pnpm --filter @scalario/nestjs run test

  flutter-analyze:
    name: Flutter — analyze
    runs-on: ubuntu-latest
    needs: nestjs-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze
        run: flutter analyze
        working-directory: apps/flutter