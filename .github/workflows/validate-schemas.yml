name: Validate BDUI Schemas

on:
  push:
    branches: [main]
    paths:
      - 'catalog/schemas/**'
      - 'scripts/validate-schemas.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'catalog/schemas/**'
      - 'scripts/validate-schemas.mjs'

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate JSON Schemas (Draft 2020-12)
        run: pnpm test:schemas

      - name: Build Schema Documentation
        run: ./scripts/build-schema-docs.sh

      - name: Upload Schema Documentation
        uses: actions/upload-artifact@v4
        with:
          name: bdui-schema-docs
          path: docs/bdui-schema/
          retention-days: 30