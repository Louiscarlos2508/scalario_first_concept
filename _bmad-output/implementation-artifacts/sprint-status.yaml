        notes: "Layer 2 RBAC dynamique data-driven. @Roles(...) décorateur + RbacGuard global (intersection req.user.roles ∩ tenants.config.roles ∩ required) + SUPER_ADMIN bypass. RolesService cache mémoire TTL 5 min (API Redis-shaped pour STORY-018). AuthService.issueTokens filtre les rôles invalides avant de signer le JWT (AC-11). Migration 1700000000002 ajoute tenants.config JSONB avec default {roles:['OWNER']}. GET/PATCH /tenants/:slug/roles avec Zod (UPPER_SNAKE, unique, ≤32, system roles bloqués), 409 si DELETE d'un rôle assigné à ≥1 user actif. /tenants/provision passe de @Public à @Roles('SUPER_ADMIN') + accepte un template optionnel (catalog/domains/<id>.json) qui peuple tenants.config.roles à la création. Template retail_fresh_produce.json créé avec roles ['OWNER','MANAGER','COMMERCIAL']. 55/55 tests verts (rbac.guard 10 cases AC-03→AC-07 + SUPER_ADMIN + stale-JWT defense, roles.service 5 cases cache+invalidate+set, rbac.e2e 9 scenarios dont AC-21 OWNER 200 / COMMERCIAL 403, AC-22 LIVREUR ajouté runtime → 200 sans restart, AC-23 LIVREUR retiré → 403 next call). Lint + typecheck verts. Audit log STORY-020 = stub logger.log pour l'instant. Pas de lint CI check_roles_decorator script (déféré — Phase 2 quand les routes métier seront décorées en masse)."
