        notes: "Layer 5 — RLS sur 8 tables tenant-scoped. Migration 1700000000004-rls-policies crée les 6 tables encore manquantes (screen_configs, entities, workflow_states, audit_logs, sync_mutations, embeddings via pgvector) avec ENABLE+FORCE ROW LEVEL SECURITY et policies <table>_tenant_isolation (USING + WITH CHECK) liées à current_setting('app.current_tenant_id', true)::uuid — fail-closed (missing_ok=true). Drop de la policy placeholder user_tenant_isolation de STORY-014. audit_logs : REVOKE UPDATE/DELETE FROM PUBLIC (insert-only, STORY-020 finalisera). Migration 1700000000005-rls-app-user provisionne le rôle scalario_app NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS avec GRANT DML scopé (INSERT/SELECT only sur audit_logs) + ALTER DEFAULT PRIVILEGES pour les futures tables. typeorm.datasource.ts bascule sur DATABASE_URL_ADMIN (fallback DATABASE_URL) pour les migrations. DatabaseModule expose APP_DATASOURCE (TypeOrmModule via DATABASE_URL = scalario_app, pool 10) + ADMIN_DATA_SOURCE (DataSource raw via DATABASE_URL_ADMIN, pool 2). Boot check onModuleInit refuse de démarrer si current_user a rolbypassrls (skip en NODE_ENV=test ou RLS_BOOT_CHECK=skip). RlsBypassService.withBypass(opts, fn) avec whitelist runtime hardcodée (TenantsService.provision, AuthService.superAdminLogin, CleanupService.purge) + audit_logs INSERT systématique + ForbiddenException sur caller non-whitelisté. Tests d'intrusion rls-intrusion.e2e.spec couvrent AC-11 T1→T6 + AC-12 (WITH CHECK INSERT cross-tenant rejected) — auto-skip si DATABASE_URL_ADMIN absent (CI: les 2 URLs sont fournies + `pnpm migration:run` ajouté avant pnpm test). Unit test rls-bypass.service.spec assert le gate whitelist sans toucher la DB. Script scripts/benchmark-rls.sh (10K seed + EXPLAIN ANALYZE admin vs scalario_app + 1000 iters) + scripts/rollback-rls.sql + apps/nestjs/docs/migrations-tenant-scoped.md (checklist 6 étapes pour toute future table métier). .env.example documente DATABASE_URL_ADMIN + SCALARIO_APP_DB_PASSWORD. Différé/non livré : (a) lint CI check_rls_bypass_callers.sh — la whitelist runtime + le test unit suffisent Phase 1, le script CI sera livré quand un 4ᵉ call site sera proposé en review ; (b) benchmark p50/p95/p99 numbers concrets dans _bmad-output/benchmarks/rls-overhead.md — le script est livré, le run + rapport seront faits en pré-prod (Sprint 5 hardening) avec une vraie volumétrie ; (c) audit_logs full retention/insert-only triggers déférés à STORY-020 ; (d) RLS sur pgvector index ivfflat non créé (table vide en Phase 1 — créer l'index sur table populée Phase 2 RAG)."
      - story_id: "STORY-018"
