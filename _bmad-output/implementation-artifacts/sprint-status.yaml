        notes: "Layer 3 cross-cutting tenant isolation. tenantContext (AsyncLocalStorage) avec run/get/getOrThrow + TenantContextMissingError (AC-01→AC-04 incl. concurrence 100 req). TenantMiddleware applied globally via AppModule.configure(forRoutes('*')) — décode le JWT lui-même (middleware runs before guards en NestJS), vérifie tenants.is_active via TenantsService cache TTL 5 min (AC-08), ouvre le scope ALS, et pose app.current_tenant_id via set_config session-scoped (RESET sur release par TenantAwareQueryRunner). @CurrentTenant() decorator (AC-15/16). withTenantContext helper pour workers/cron (AC-17). TenantScopedEntity abstract base (AC-12). TenantIsolationFilter (APP_FILTER) intercepte QueryFailedError code 42501 → 403 sanitized sans leak SQL (AC-19) + log TENANT_VIOLATION_DETECTED (AC-20 stub). TenantAwareQueryRunner pour raw SQL (set_config + RESET garanti on release, AC-09/10/11). Migration 1700000000003-tenant-id-default pose le GUC par défaut au niveau DB (best-effort si managed DB sans privilege). Document _bmad-output/architecture-notes/phase2-schema-per-tenant.md livré (triggers, procédure, dual-mode middleware, estimation 5j+2j). 76/76 tests verts (15 suites) — AC-23 concurrence 100 req parallèles A/B sans leak prouvée. Lint + typecheck verts. AC-22 (intrusion cross-tenant via RLS) deferred to STORY-017 (RLS policies pas encore en place). CI lint check TenantScopedEntity extends déféré (Phase 2 quand entities métier seront en masse)."
