        notes: "Layer 1 sécurité complet : Passport Local+JWT, JwtAuthGuard global avec @Public, AuthService (login + issueTokens + refresh rotation + reuse-detection family-revoke + logout + findUserById tenant-scoped). Migration tenants/users/refresh_tokens avec indexes + RLS placeholder. bcrypt cost 12 + SHA-256 sur refresh tokens + dummy-hash anti-timing user enumeration. Throttler 5/min sur /auth/login. RedactInterceptor global (password/access_token/refresh_token/token_hash → [REDACTED]). JWT_SECRET validé au boot (≥32 chars). 29/29 tests verts (auth.service + auth.controller + auth.e2e in-memory + redact). Lint + typecheck verts. AC-19 (forged JWT 401) + AC-20 (findUserById tenant-scoped) + AC-12 (reuse family revoke) explicitement testés. AC-23 (JWT_REFRESH_SECRET) non implémenté — refresh tokens sont random bytes + SHA-256, pas des JWTs (incohérence interne story). RBAC SUPER_ADMIN sur /tenants/provision déféré à STORY-015."
