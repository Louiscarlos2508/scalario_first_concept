# Scalario — analyzer config.
#
# Hardcode-prevention :
# - Lints stricts (prefer_const_constructors, etc.).
# - Le check anti-hardcode (Color(0xFF…), magic-number padding) est dans
#   `scripts/check_no_hardcoded_tokens.dart` — exécuté en CI et par les
#   tests (`test/core/design_system/tokens/no_hardcoded_tokens_test.dart`).
#   Ce script remplace un plugin `custom_lint` lourd à maintenir.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Tout warning devient une erreur — on bloque les imports inutiles, les
    # paramètres non utilisés, etc.
    invalid_assignment: error
    missing_required_param: error
    missing_return: error
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # Hygiène générale
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    avoid_redundant_argument_values: true
    avoid_unnecessary_containers: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true

    # Style
    prefer_single_quotes: true
    require_trailing_commas: true

    # Sécurité / API
    avoid_print: true
    avoid_dynamic_calls: true
    no_logic_in_create_state: true
