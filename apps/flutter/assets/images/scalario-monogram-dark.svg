<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" width="440" height="260">
  <!-- S icon: 4 cubic bezier arcs, translate(28, 16) -->
  <g fill="none" stroke-width="13" stroke-linecap="round">
    <!-- Yellow: top arc -->
    <path d="M 64 24 C 48 24 36 34 36 48" stroke="#FFCC00"/>
    <!-- Blue: upper to inflection -->
    <path d="M 36 48 C 36 60 48 66 64 66" stroke="#1A73E8"/>
    <!-- Green: inflection to lower -->
    <path d="M 64 66 C 78 66 90 72 90 86" stroke="#34A853"/>
    <!-- Red: bottom arc -->
    <path d="M 90 86 C 90 98 78 106 64 106" stroke="#EA4335"/>
  </g>
  <!-- c arc: center (152, 65), r=34, opening ±32° -->
  <path d="M 180.7 47 A 34 34 0 1 0 180.7 83"
        fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
</svg>
