name: scalario
description: "Scalario — Instant Business OS pour PME africaines (BDUI Engine + Templates JSON)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Design System fonts (Inter + Roboto Mono via Google Fonts API runtime cache).
  google_fonts: ^6.3.2

  # Brand SVG icons (WhatsApp et autres marques tierces).
  flutter_svg: ^2.2.3

  # Bar/Line charts BDUI — AC-36 (STORY-003).
  fl_chart: ^0.68.0

  # DI container — ComponentRegistry singleton + BDUIEngine (STORY-005, STORY-008).
  get_it: ^8.0.3

  # Annotations @immutable, @visibleForTesting — pure Dart, no Flutter import.
  meta: ^1.16.0

  # JSON Schema Draft 2020-12 validation — STORY-026 validation bidirectionnelle.
  json_schema: ^5.2.2

  # SHA-256 for payload hashing (no PII in logs).
  crypto: ^3.0.6

  # STORY-033 — Persistance locale offline-first avec Drift ORM + SQLCipher.
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlcipher_flutter_libs: ^0.7.0+eol
  sqlite3: ^3.3.1
  path_provider: ^2.1.5

  # STORY-033 — Stockage sécurisé passphrase DB + JWT tokens (hors Drift).
  flutter_secure_storage: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # STORY-033 — Code generation Drift (tables → .g.dart).
  build_runner: ^2.15.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/sandbox/
    - assets/bdui-schemas/

  # Inter et Roboto Mono sont chargées via google_fonts (runtime cache).
  # Voir lib/core/design_system/tokens/typography.dart.
