<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Scalario — Instant Business OS pour PME africaines. BDUI Engine + templates JSON, un codebase, toutes plateformes.">

  <!-- STORY-012 — theme-color aligné sur ScalarioColors.primary500 (#2980B9). -->
  <meta name="theme-color" content="#2980B9">

  <!-- iOS web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scalario">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Scalario — Instant Business OS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash anti-flash blanc avant Flutter boot (STORY-012). Couleur = primary500. */
    html, body { margin: 0; padding: 0; background-color: #2980B9; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #2980B9;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600; font-size: 1.5rem; letter-spacing: 0.05em;
      z-index: 9999;
      transition: opacity 200ms ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">Scalario</div>
  <script>
    function removeSplash() {
      var el = document.getElementById('splash');
      if (el) { el.classList.add('hidden'); setTimeout(function(){ el.remove(); }, 250); }
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    window.addEventListener('load', function () { setTimeout(removeSplash, 8000); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
