<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scalario — Splash</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      background: #0f172a;
      border-radius: 2.5rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      padding: 16px 24px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .status-time { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 32px 48px;
    }
    .spacer { flex: 1; }

    /* Wordmark */
    .wordmark-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fade-up 0.8s ease-out 0.3s forwards;
    }
    .wordmark-svg { display: block; }
    .tagline {
      color: rgba(255,255,255,0.5);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.75;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      animation: fade-up 0.8s ease-out 0.7s forwards;
    }

    /* Bottom */
    .bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      animation: fade-up 0.8s ease-out 1.1s forwards;
    }
    .dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
    }
    .dot:nth-child(1) { animation: bounce 1.4s ease-in-out 0s infinite; }
    .dot:nth-child(2) { animation: bounce 1.4s ease-in-out 0.18s infinite; }
    .dot:nth-child(3) { animation: bounce 1.4s ease-in-out 0.36s infinite; }
    .cta {
      width: 100%;
      padding: 16px;
      background: white;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      animation: glow 2s ease-in-out 1.8s infinite;
    }
    .legal {
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }

    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-7px); opacity: 1; }
    }
    @keyframes glow {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
      70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
  </style>
</head>
<body>

  <div class="phone-frame">

    <!-- Status bar -->
    <div class="status-bar">
      <span class="status-time">20h14</span>
      <div class="status-icons">
        <svg width="14" height="14" fill="rgba(255,255,255,0.5)" viewBox="0 0 24 24"><path d="M1.5 8.5a13 13 0 0121 0M5 12a10 10 0 0114 0M8.5 15.5a6 6 0 017 0M12 19h.01"/></svg>
        <div style="width:20px;height:10px;border:1.5px solid rgba(255,255,255,0.5);border-radius:2px;position:relative;">
          <div style="position:absolute;left:2px;top:2px;bottom:2px;width:12px;background:rgba(255,255,255,0.5);border-radius:1px;"></div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="content">

      <div class="spacer"></div>

      <!-- Wordmark seul — S arcs + CALARIO text -->
      <div class="wordmark-wrap">
        <svg class="wordmark-svg"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="30 14 535 104"
             width="300" height="58"
             style="display:block; margin:0 auto;">
          <g fill="none" stroke-width="13" stroke-linecap="round">
            <path d="M 64 24 C 48 24 36 34 36 48" stroke="#FFCC00"/>
            <path d="M 36 48 C 36 60 48 66 64 66" stroke="#1A73E8"/>
            <path d="M 64 66 C 78 66 90 72 90 86" stroke="#34A853"/>
            <path d="M 90 86 C 90 98 78 106 64 106" stroke="#EA4335"/>
          </g>
          <text x="108" y="100" font-size="104" fill="#FFFFFF" letter-spacing="4"
                font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif">CALARIO</text>
        </svg>

        <p class="tagline">
          Gérez votre boutique.<br/>
          Sachez ce qui se passe.<br/>
          Depuis n'importe où.
        </p>
      </div>

      <div class="spacer"></div>

      <!-- Bottom -->
      <div class="bottom">
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <button class="cta">Commencer</button>
        <p class="legal">En continuant, vous acceptez<br/>les conditions d'utilisation de Scalario</p>
      </div>

    </div>
  </div>

</body>
</html>
