<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scalario — Identification Vendeur</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* ── Layout ── */
    .screen {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 40px;
    }

    /* Logo + boutique */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .boutique-name {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.3px;
    }
    .date-badge {
      font-size: 13px;
      color: rgba(255,255,255,0.25);
    }

    /* Qui travaille aujourd'hui ? */
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-align: center;
    }

    /* Employee cards */
    .employee-list {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .employee-card {
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .employee-card:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.18);
    }
    .employee-card.selected {
      background: rgba(26,115,232,0.15);
      border-color: #1A73E8;
    }
    .emp-avatar {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .emp-name {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      text-align: center;
      line-height: 1.3;
    }
    .emp-role {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }
    .emp-selected-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #1A73E8;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .employee-card.selected .emp-selected-dot { opacity: 1; }

    /* PIN panel */
    .pin-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 320px;
    }
    .pin-who {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
    }
    .pin-who-avatar {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: #1A73E8;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .pin-who-name { font-size: 14px; font-weight: 600; color: white; }
    .pin-who-change { font-size: 12px; color: #1A73E8; cursor: pointer; margin-left: auto; }

    /* PIN dots */
    .pin-dots {
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      background: transparent;
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: white;
      border-color: white;
    }

    /* Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }
    .key {
      height: 58px;
      border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }
    .key:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
    .key:active { transform: scale(0.95); }
    .key.empty { background: transparent; border-color: transparent; cursor: default; }
    .key.delete { font-size: 16px; }
    .key.confirm {
      background: #1A73E8;
      border-color: #1A73E8;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(26,115,232,0.35);
      grid-column: span 3;
      height: 52px;
    }
    .key.confirm:hover { background: #1557b0; }

    .pin-error {
      font-size: 13px;
      color: #EA4335;
      display: none;
    }

    /* Prototype nav (outside frame concept) */
    .proto-nav {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
    }
    .proto-btn {
      padding: 8px 14px;
      border-radius: 10px;
      background: white;
      border: 1.5px solid #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .proto-btn.on { border-color: #1A73E8; color: #1A73E8; background: #eff6ff; }
  </style>
</head>
<body>

  <!-- ── Vue A : sélection employé ── -->
  <div class="screen" id="viewA">

    <div class="header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 14 535 104" height="30">
        <g fill="none" stroke-width="13" stroke-linecap="round">
          <path d="M 64 24 C 48 24 36 34 36 48" stroke="#FFCC00"/>
          <path d="M 36 48 C 36 60 48 66 64 66" stroke="#1A73E8"/>
          <path d="M 64 66 C 78 66 90 72 90 86" stroke="#34A853"/>
          <path d="M 90 86 C 90 98 78 106 64 106" stroke="#EA4335"/>
        </g>
        <text x="108" y="100" font-size="104" fill="#FFFFFF" letter-spacing="4"
              font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif">CALARIO</text>
      </svg>
      <div class="boutique-name">Boissons Ouédraogo</div>
      <div class="date-badge">Mercredi 1er avril 2026</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div class="section-label">Qui travaille aujourd'hui ?</div>
      <div class="employee-list">
        <div class="employee-card selected" onclick="selectEmployee(this, 'KT', 'Koné Tiéba', '#1A73E8')">
          <div class="emp-avatar" style="background:#1A73E8;">KT</div>
          <div class="emp-name">Koné Tiéba</div>
          <div class="emp-role">Vendeur</div>
          <div class="emp-selected-dot"></div>
        </div>
        <div class="employee-card" onclick="selectEmployee(this, 'AM', 'Amadou M.', '#34A853')">
          <div class="emp-avatar" style="background:#34A853;">AM</div>
          <div class="emp-name">Amadou Maïga</div>
          <div class="emp-role">Vendeur</div>
          <div class="emp-selected-dot"></div>
        </div>
      </div>
    </div>

    <button onclick="goPin()" style="padding:14px 40px;background:#1A73E8;color:white;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 14px rgba(26,115,232,0.35);">
      Continuer →
    </button>

  </div>

  <!-- ── Vue B : saisie PIN ── -->
  <div class="screen" id="viewB" style="display:none;">

    <div class="header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 14 535 104" height="26">
        <g fill="none" stroke-width="13" stroke-linecap="round">
          <path d="M 64 24 C 48 24 36 34 36 48" stroke="#FFCC00"/>
          <path d="M 36 48 C 36 60 48 66 64 66" stroke="#1A73E8"/>
          <path d="M 64 66 C 78 66 90 72 90 86" stroke="#34A853"/>
          <path d="M 90 86 C 90 98 78 106 64 106" stroke="#EA4335"/>
        </g>
        <text x="108" y="100" font-size="104" fill="#FFFFFF" letter-spacing="4"
              font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif">CALARIO</text>
      </svg>
    </div>

    <div class="pin-panel">

      <div class="pin-who">
        <div class="pin-who-avatar" id="pinAvatar">KT</div>
        <span class="pin-who-name" id="pinName">Koné Tiéba</span>
        <span class="pin-who-change" onclick="goA()">Changer</span>
      </div>

      <div class="pin-dots" id="pinDots">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>

      <div class="pin-error" id="pinError">Code incorrect. Réessayez.</div>

      <div class="keypad">
        <div class="key" onclick="pressKey('1')">1</div>
        <div class="key" onclick="pressKey('2')">2</div>
        <div class="key" onclick="pressKey('3')">3</div>
        <div class="key" onclick="pressKey('4')">4</div>
        <div class="key" onclick="pressKey('5')">5</div>
        <div class="key" onclick="pressKey('6')">6</div>
        <div class="key" onclick="pressKey('7')">7</div>
        <div class="key" onclick="pressKey('8')">8</div>
        <div class="key" onclick="pressKey('9')">9</div>
        <div class="key empty"></div>
        <div class="key" onclick="pressKey('0')">0</div>
        <div class="key delete" onclick="deleteKey()">⌫</div>
        <div class="key confirm" onclick="confirmPin()">Ouvrir ma session →</div>
      </div>

    </div>

  </div>

  <!-- Proto nav -->
  <div class="proto-nav">
    <div class="proto-btn on" id="btnA" onclick="goA()">A — Sélection</div>
    <div class="proto-btn" id="btnB" onclick="goPin()">B — PIN</div>
  </div>

  <script>
    let pin = '';
    let selectedName = 'Koné Tiéba';
    let selectedInitials = 'KT';
    let selectedColor = '#1A73E8';

    function selectEmployee(card, initials, name, color) {
      document.querySelectorAll('.employee-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedInitials = initials;
      selectedName = name;
      selectedColor = color;
    }

    function goA() {
      document.getElementById('viewA').style.display = 'flex';
      document.getElementById('viewB').style.display = 'none';
      document.getElementById('btnA').classList.add('on');
      document.getElementById('btnB').classList.remove('on');
      pin = '';
      renderDots();
    }

    function goPin() {
      document.getElementById('viewA').style.display = 'none';
      document.getElementById('viewB').style.display = 'flex';
      document.getElementById('btnB').classList.add('on');
      document.getElementById('btnA').classList.remove('on');
      document.getElementById('pinAvatar').textContent = selectedInitials;
      document.getElementById('pinAvatar').style.background = selectedColor;
      document.getElementById('pinName').textContent = selectedName;
      pin = '';
      renderDots();
      document.getElementById('pinError').style.display = 'none';
    }

    function pressKey(k) {
      if (pin.length >= 4) return;
      pin += k;
      renderDots();
      if (pin.length === 4) {
        setTimeout(confirmPin, 200);
      }
    }

    function deleteKey() {
      pin = pin.slice(0, -1);
      renderDots();
      document.getElementById('pinError').style.display = 'none';
    }

    function renderDots() {
      const dots = document.querySelectorAll('#pinDots .pin-dot');
      dots.forEach((d, i) => {
        d.classList.toggle('filled', i < pin.length);
      });
    }

    function confirmPin() {
      if (pin.length < 4) return;
      // Simulation : n'importe quel PIN de 4 chiffres passe
      // (sauf 0000 pour montrer l'erreur)
      if (pin === '0000') {
        document.getElementById('pinError').style.display = 'block';
        pin = '';
        renderDots();
      } else {
        // Succès → message prototype
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.85);display:flex;align-items:center;justify-content:center;z-index:100;';
        overlay.innerHTML = `<div style="background:#1A73E8;border-radius:20px;padding:32px 40px;text-align:center;color:white;">
          <div style="font-size:32px;margin-bottom:12px;">✓</div>
          <div style="font-size:18px;font-weight:700;">Session ouverte</div>
          <div style="font-size:14px;opacity:0.7;margin-top:6px;">${selectedName} · 08h14</div>
          <div style="font-size:13px;opacity:0.5;margin-top:16px;">→ Accès au POS Catalogue</div>
          <button onclick="this.closest('div[style*=fixed]').remove()" style="margin-top:20px;padding:10px 24px;background:rgba(255,255,255,0.2);color:white;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">Fermer</button>
        </div>`;
        document.body.appendChild(overlay);
        pin = '';
        renderDots();
      }
    }
  </script>

</body>
</html>
