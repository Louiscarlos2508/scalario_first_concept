# Override dev — ajoute Adminer (UI Postgres) et expose postgres/redis sur localhost
# pour les outils dev externes (psql, redis-cli, IDE DB clients). NE PAS utiliser en prod.
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  nestjs:
    volumes:
      - ./catalog:/app/catalog:ro

  adminer:
    image: adminer:latest
    container_name: scalario-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks: [scalario]
